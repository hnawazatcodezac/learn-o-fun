<!-- @dsCard group="Play" height=330 subtitle="The three Today cards" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ActivityCard</title></head>
<body>
<div class="lf-stage" style="align-items:flex-start">
  <article class="lf-card">
    <div class="lf-card-art coral" aria-hidden="true">
      <span class="lf-shape disc soft" style="width:72px;height:72px;inset-inline-start:24px;top:20px"></span>
      <span class="lf-shape pebble navy" style="width:96px;height:48px;inset-inline-start:112px;top:44px"></span>
      <span class="lf-shape disc sun" style="width:32px;height:32px;inset-inline-start:176px;top:12px"></span>
    </div>
    <div class="lf-card-body"><span class="lf-kicker review">Review</span><h3 class="lf-card-title">Number bonds to 10</h3><span class="lf-card-meta">About 4 minutes</span></div>
  </article>
  <article class="lf-card">
    <div class="lf-card-art sun" aria-hidden="true">
      <span class="lf-shape pebble soft" style="width:112px;height:40px;inset-inline-start:20px;top:52px"></span>
      <span class="lf-shape disc leaf" style="width:48px;height:48px;inset-inline-start:148px;top:20px"></span>
      <span class="lf-shape disc navy" style="width:20px;height:20px;inset-inline-start:196px;top:76px"></span>
    </div>
    <div class="lf-card-body"><span class="lf-kicker new">New skill</span><h3 class="lf-card-title">Hop to 20</h3><span class="lf-card-meta">About 6 minutes</span></div>
  </article>
  <article class="lf-card">
    <div class="lf-card-art sky" aria-hidden="true">
      <span class="lf-shape pebble soft" style="width:40px;height:40px;inset-inline-start:24px;top:24px"></span>
      <span class="lf-shape pebble soft" style="width:40px;height:40px;inset-inline-start:72px;top:24px"></span>
      <span class="lf-shape pebble leaf" style="width:40px;height:40px;inset-inline-start:24px;top:72px"></span>
      <span class="lf-shape pebble leaf" style="width:40px;height:40px;inset-inline-start:72px;top:72px"></span>
      <span class="lf-shape disc navy" style="width:56px;height:56px;inset-inline-start:144px;top:36px"></span>
    </div>
    <div class="lf-card-body"><span class="lf-kicker choice">Your choice</span><h3 class="lf-card-title">Tile Farm</h3><span class="lf-card-meta">About 5 minutes</span></div>
  </article>
</div>
</body>
</html>
