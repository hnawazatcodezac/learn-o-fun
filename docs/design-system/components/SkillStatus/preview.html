<!-- @dsCard group="Family" height=100 subtitle="Six statuses, each with an icon and a word" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SkillStatus</title></head>
<body>
<div class="lf-stage family">
  <span class="lf-status not-started"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/></svg>Not started</span>
  <span class="lf-status exploring"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8V2a6 6 0 0 1 6 6z" fill="currentColor"/></svg>Exploring</span>
  <span class="lf-status building"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>Building</span>
  <span class="lf-status strong"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8V2a6 6 0 1 1-6 6z" fill="currentColor"/></svg>Strong</span>
  <span class="lf-status mastered"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.8 8.2l2.1 2.1 4.3-4.4" fill="none" style="stroke:var(--leaf-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Mastered</span>
  <span class="lf-status review"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 2.5v3h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Review due</span>
</div>
</body>
</html>
