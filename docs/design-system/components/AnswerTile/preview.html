<!-- @dsCard group="Play" height=220 subtitle="Default, selected, correct, try again" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AnswerTile</title></head>
<body>
<div class="lf-stage">
  <span class="lf-prompt">7 + 5 =</span>
  <div class="lf-col"><button class="lf-tile" type="button">11</button><span class="lf-tile-state">Answer</span></div>
  <div class="lf-col"><button class="lf-tile is-selected" type="button" aria-pressed="true">13</button><span class="lf-tile-state">Chosen</span></div>
  <div class="lf-col"><button class="lf-tile is-correct" type="button">12</button><span class="lf-tile-state correct"><svg class="lf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Correct</span></div>
  <div class="lf-col"><button class="lf-tile is-try" type="button">14</button><span class="lf-tile-state try"><svg class="lf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4v4.5H9"/></svg>Try again</span></div>
</div>
</body>
</html>
