<!-- @dsCard group="Play" height=300 subtitle="Correct, try again, hint" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Feedback</title></head>
<body>
<div class="lf-stage" style="flex-direction:column;align-items:stretch">
  <div class="lf-feedback correct" role="status"><span class="lf-badge"><svg class="lf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>You counted on from 7.<small>7 + 5 = 12</small></span></div>
  <div class="lf-feedback try" role="status"><span class="lf-badge"><svg class="lf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4v4.5H9"/></svg></span><span>Nearly. Try one more hop.<small>Count the hops as you go.</small></span></div>
  <div class="lf-feedback hint" role="status"><span class="lf-badge"><svg class="lf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg></span><span>Start at 7.<small>Then hop 5 times along the line.</small></span></div>
</div>
</body>
</html>
