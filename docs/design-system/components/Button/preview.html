<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="lf-stage">
  <button class="lf-btn lf-btn-play" type="button"><svg class="lf-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>Let's play</button>
  <button class="lf-btn lf-btn-play sky" type="button">Hear it again</button>
  <button class="lf-btn lf-btn-play is-pressed" type="button">Pressed</button>
</div>
<div class="lf-stage family">
  <button class="lf-btn lf-btn-family" type="button">Add a child</button>
  <button class="lf-btn lf-btn-family quiet" type="button">See all skills</button>
</div>
</body>
</html>
